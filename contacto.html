      <p>Escribime y conversamos. Estoy en Salta, Argentina y busco mi primera oportunidad en desarrollo web.</p>

        <div>
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="6" required></textarea>
        </div>

          <label for="gotcha">No completar este campo</label>
          <input type="text" id="gotcha" name="_gotcha" tabindex="-1" autocomplete="off">
        </div>

        <button type="submit" class="boton principal">Enviar mensaje</button>
      </form>
